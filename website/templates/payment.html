{% extends "base.html" %}

{% block title %}
Payment
{% endblock %}

{% block content %}

<div class="hero">

    <h1>Payment</h1>

</div>

<div class="card">

    <div class="card-content">

        <h2>{{ room[0] }}</h2>

        <p>
            {{ room[1] }} SEK/night
        </p>

    </div>

</div>

<div class="card">

    <div class="card-content">

        <h2>Choose Payment Method</h2>

        <div class="badge">💳 Card</div>
        <div class="badge">📱 Swish</div>
        <div class="badge">🧾 Invoice</div>
        <div class="badge">💰 PayPal</div>

        <br><br>

        <button class="button">
            Confirm Payment
        </button>

    </div>

</div>

{% endblock %}
